<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Inventium Iv orbital logo">
 <defs>
  <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#101F42"/>
   <stop offset="1" stop-color="#030A1B"/>
  </linearGradient>
  <radialGradient id="planet" cx="31%" cy="22%" r="84%">
   <stop stop-color="#59EEFF"/>
   <stop offset=".23" stop-color="#21A7E8"/>
   <stop offset=".57" stop-color="#075CB8"/>
   <stop offset="1" stop-color="#06245B"/>
  </radialGradient>
  <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
   <stop stop-color="#2AF1F7"/>
   <stop offset=".60" stop-color="#47B5FF"/>
   <stop offset="1" stop-color="#B783FF"/>
  </linearGradient>
  <radialGradient id="electron">
   <stop stop-color="#FFF9C8"/>
   <stop offset=".55" stop-color="#FFC04D"/>
   <stop offset="1" stop-color="#F67819"/>
  </radialGradient>
 </defs>
 <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#space)" stroke="#2A679D" stroke-width="1.6"/>
 <circle cx="32" cy="32" r="25" fill="#20CEFF" opacity=".12"/>
 <!-- Back half of the orbit -->
 <ellipse cx="32" cy="32" rx="29.5" ry="12" transform="rotate(-29 32 32)" fill="none" stroke="url(#orbit)" stroke-width="2.7" opacity=".73"/>
 <!-- Clear luminous sphere for small browser-tab sizes -->
 <circle cx="32" cy="32" r="22" fill="url(#planet)" stroke="#52E7FF" stroke-width="1.6"/>
 <path d="M17 17 Q32 9 46 18" fill="none" stroke="#D1FFFF" stroke-width="1.7" stroke-linecap="round" opacity=".50"/>
 <!-- Large, crisp Iv monogram. No atomic number or small text. -->
 <text x="32" y="43.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="33.5" font-weight="900" letter-spacing="-2" fill="#FFFFFF">Iv</text>
 <!-- Foreground orbital sweep -->
 <path d="M7.8 45.6 C17.4 57.8 42.2 52.7 56.3 24.5" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-linecap="round"/>
 <circle cx="51.8" cy="16" r="4.1" fill="url(#electron)" stroke="#FFE59B" stroke-width=".9"/>
 <circle cx="51.8" cy="16" r="5.7" fill="none" stroke="#FFAB47" stroke-width=".7" opacity=".36"/>
</svg>