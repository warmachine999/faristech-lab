<!doctype html><html lang="en" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Friends Chat · FarisTech X</title><style>
:root{--bg:#101114;--panel:#1b1e22;--field:#25292e;--fg:#f5f6f7;--muted:#9ba3ad;--line:#363b42;--accent:#39916b}html[data-theme=light]{--bg:#eef1f4;--panel:#fff;--field:#f3f5f7;--fg:#171a1f;--muted:#68717b;--line:#dce1e7;--accent:#23865e}html[data-theme=tech]{--bg:#07151c;--panel:#10232d;--field:#17313c;--fg:#eaffff;--muted:#91acb7;--line:#2b4752;--accent:#00a6c5}html[data-theme=caramel]{--bg:#21170f;--panel:#302216;--field:#3d2b1b;--fg:#fff4e5;--muted:#c6ad91;--line:#58402b;--accent:#d88a43}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);font:15px system-ui}.app{height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-weight:800}.brand{flex:1}.brand small{display:block;color:var(--muted)}button,a{font:inherit;cursor:pointer}.top button,.top a{background:var(--field);border:1px solid var(--line);color:var(--fg);padding:8px 11px;border-radius:11px;text-decoration:none}.feed{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px;background-image:radial-gradient(var(--line) .6px,transparent .6px);background-size:20px 20px}.msg{align-self:flex-start;max-width:88%;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:4px 14px 14px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}.meta time{color:var(--muted);font-weight:400;margin-left:8px}.msg img,.msg video{max-width:100%;max-height:340px;border-radius:9px;display:block}.msg audio{max-width:100%}.tools{display:flex;justify-content:flex-end;gap:8px}.tools button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:3px}.composerWrap{padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}.composer{display:flex;align-items:center;gap:7px;background:var(--field);border:1px solid var(--line);border-radius:28px;padding:6px 9px;min-height:54px}.icon{border:0;background:transparent;color:var(--fg);font-size:22px;width:36px;height:36px}.input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px}.send{border:0;border-radius:50%;width:38px;height:38px;background:var(--accent);color:white;display:none}.send.on{display:block}.panel{display:none;padding:8px 0}.panel.on{display:block}.emojis{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-height:135px;overflow:auto}.emojis button{border:0;background:transparent;font-size:23px;padding:5px}.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:18px}.gate[hidden]{display:none}.box{width:min(100%,390px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:23px}.box p{color:var(--muted)}.box input{width:100%;padding:13px;margin:6px 0;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--fg)}.primary{width:100%;padding:13px;background:var(--accent);color:white;border:0;border-radius:11px;font-weight:700}.hint{color:var(--muted);font-size:12px}.empty{margin:auto;color:var(--muted)}#composerWrap[hidden]{display:none}@media(max-width:560px){.top{height:56px;padding:0 9px}.top button,.top a{font-size:12px;padding:8px}.feed{padding:11px 9px}.emojis{grid-template-columns:repeat(7,1fr)}}
</style><body><div class="app"><header class="top"><div class="avatar">F</div><div class="brand"><b>Friends Chat</b><small id="status">FarisTech X · private room</small></div><button id="theme">◐ Theme</button><a href="index.html">⌂ Home</a></header><main class="feed" id="feed"><div class="empty">Loading chat…</div></main><section class="composerWrap" id="composerWrap" hidden><div class="panel" id="emojiPanel"><div class="emojis" id="emojiGrid"></div><p class="hint">Attach a GIF file with 📎. Emoji picker is ready.</p></div><div class="composer"><button class="icon" id="clip" aria-label="Attach">📎</button><button class="icon" id="emoji" aria-label="Emoji">☻</button><input class="input" id="text" placeholder="Type a message" maxlength="1500"><button class="icon" id="mic" aria-label="Voice">🎙</button><button class="send" id="send">➤</button><input id="file" type="file" hidden accept="image/*,video/*,audio/*"></div></section></div>
<div class="gate" id="gate"><div class="box"><h2>Friends Chat</h2><p id="desc">Enter the chat password to continue.</p><input id="pass" type="password" placeholder="Chat password"><div id="nameWrap" hidden><input id="name" maxlength="24" placeholder="Display name (optional)"><p class="hint">Leave blank to read only.</p></div><button class="primary" id="go">Continue</button><p class="hint"><a href="index.html" style="color:var(--accent)">Back to homepage</a></p></div></div>
<script>
const API='https://faristech-chat-api.makerlab.workers.dev', $=x=>document.getElementById(x);let token=localStorage.getItem('ft-chat-token')||'',sid=localStorage.getItem('ft-chat-id')||crypto.randomUUID(),name=localStorage.getItem('ft-friend-name')||'',poll,rec,chunks=[];localStorage.setItem('ft-chat-id',sid);
function setTheme(){document.documentElement.dataset.theme=localStorage.getItem('ft-theme')||'dark'}setTheme();$('theme').onclick=()=>{let a=['dark','light','tech','caramel'],t=document.documentElement.dataset.theme;localStorage.setItem('ft-theme',a[(a.indexOf(t)+1)%a.length]);setTheme()};
async function req(p,m='GET',b){let r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
$('go').onclick=async()=>{try{if($('nameWrap').hidden){if(!$('pass').value)throw Error('Enter the chat password.');$('pass').hidden=true;$('nameWrap').hidden=false;$('name').value=name;$('desc').textContent='Choose a display name (optional).';$('go').textContent='Open chat';return}name=$('name').value.trim();localStorage.setItem('ft-friend-name',name);let d=await req('/auth/chat','POST',{password:$('pass').value,senderId:sid,name});token=d.token;localStorage.setItem('ft-chat-token',token);$('gate').hidden=true;start()}catch(e){alert(e.message)}};
$('pass').onkeydown=e=>{if(e.key==='Enter')$('go').click()};$('name').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
async function start(){$('gate').hidden=true;$('composerWrap').hidden=!name;$('status').textContent=name?'Connected as '+name:'Read only';await refresh();clearInterval(poll);poll=setInterval(refresh,4000)}
const rendered=new Map();
function makeMessage(m){
 let el=document.createElement('article');el.className='msg';el.dataset.id=String(m.id);
 let meta=document.createElement('div');meta.className='meta';let who=document.createElement('span');who.className='who';let tm=document.createElement('time');meta.append(who,tm);let edited=document.createElement('span');edited.className='edited';meta.append(edited);el.append(meta);
 let body=document.createElement('div');body.className='messageBody';el.append(body);
 let tools=document.createElement('div');tools.className='tools';el.append(tools);
 updateMessage(el,m);return el;
}
function updateMessage(el,m){
 el.dataset.signature=[m.type,m.content,m.sender_id,m.sender_name,m.created_at,m.edited_at||''].join('|');
 const who=el.querySelector('.who');who.textContent=(m.sender_id===sid?'You':m.sender_name)+' · ';
 el.querySelector('time').textContent=new Date(m.created_at).toLocaleString();
 el.querySelector('.edited').textContent=m.edited_at?' · edited':'';
 const body=el.querySelector('.messageBody');
 // Only rebuild the content when the actual message changes, never on each poll.
 body.replaceChildren();
 if(['image','gif'].includes(m.type)){let im=document.createElement('img');im.src=m.content;im.alt=m.type==='gif'?'GIF attachment':'Image attachment';body.append(im)}
 else if(m.type==='video'){let v=document.createElement('video');v.src=m.content;v.controls=true;v.preload='metadata';body.append(v)}
 else if(m.type==='audio'){let a=document.createElement('audio');a.src=m.content;a.controls=true;a.preload='metadata';body.append(a)}
 else{let t=document.createElement('div');t.textContent=m.content;body.append(t)}
 const tools=el.querySelector('.tools');tools.replaceChildren();
 if(m.sender_id===sid){
  if(m.type==='text'){let edit=document.createElement('button');edit.textContent='Edit';edit.onclick=async()=>{let v=prompt('Edit message',m.content);if(v?.trim()){await req('/messages/'+m.id,'PATCH',{content:v.trim()});refresh()}};tools.append(edit)}
  let del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(confirm('Delete this message?')){await req('/messages/'+m.id,'DELETE');refresh()}};tools.append(del);
 }
 if(['image','gif','video','audio'].includes(m.type)){
  let a=document.createElement('a');a.textContent='Download';a.href=m.content;a.download='faristech-'+m.id+(m.type==='video'?'.webm':m.type==='audio'?'.webm':m.type==='gif'?'.gif':'.jpg');a.style.color='var(--accent)';a.style.fontSize='12px';a.style.marginLeft='8px';tools.append(a);
 }
}
async function refresh(){try{
 let d=await req('/messages'),feed=$('feed'),nearBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<100;
 const incoming=new Set(d.messages.map(m=>String(m.id)));
 for(const [id,el] of rendered){if(!incoming.has(id)){el.remove();rendered.delete(id)}}
 if(!d.messages.length){if(!feed.querySelector('.empty')){feed.replaceChildren(Object.assign(document.createElement('div'),{className:'empty',textContent:'No messages yet. Start the conversation.'}))}return}
 feed.querySelector('.empty')?.remove();
 for(const m of d.messages){
  const id=String(m.id);let el=rendered.get(id);
  if(!el){el=makeMessage(m);rendered.set(id,el);feed.append(el)}
  else if(el.dataset.signature!==[m.type,m.content,m.sender_id,m.sender_name,m.created_at,m.edited_at||''].join('|'))updateMessage(el,m);
 }
 // Keep server order without recreating nodes or interrupting media playback.
 for(const m of d.messages){const el=rendered.get(String(m.id));if(el&&el!==feed.lastElementChild)feed.append(el)}
 if(nearBottom)feed.scrollTop=feed.scrollHeight;
 }catch(e){if(token){token='';localStorage.removeItem('ft-chat-token');$('gate').hidden=false;alert(e.message)}}}
async function send(type='text',content){let c=content??$('text').value.trim();if(!c)return;try{await req('/messages','POST',{type,content:c});$('text').value='';$('send').classList.remove('on');$('emojiPanel').classList.remove('on');refresh()}catch(e){alert(e.message)}}
$('send').onclick=()=>send();$('text').oninput=()=>$('send').classList.toggle('on',!!$('text').value.trim());$('text').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
let em='😀 😃 😄 😁 😆 😅 😂 🙂 😉 😊 😍 🥰 😎 🤩 🥳 😭 😮 🤔 😇 😋 🤗 👍 👎 👏 🙌 🙏 💪 ❤️ 💛 💚 💙 💜 💯 🔥 ✨ ⭐ 🎉 🚀 🤖 ⚡ 💡 🛠️ 🎮 📱 💻 🎧 📷'.split(' ');$('emojiGrid').innerHTML=em.map(x=>'<button>'+x+'</button>').join('');$('emojiGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('text').value+=[...b.textContent].join('');$('text').focus();$('send').classList.add('on')});$('emoji').onclick=()=>$('emojiPanel').classList.toggle('on');
$('clip').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>300000){alert('For now, attachments are limited to 300 KB. Enable R2 storage for larger media.');e.target.value='';return}let r=new FileReader();r.onload=()=>send(f.type==='image/gif'?'gif':f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'audio',r.result);r.readAsDataURL(f);e.target.value=''};
$('mic').onclick=async()=>{if(rec?.state==='recording'){rec.stop();$('mic').textContent='🎙';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(blob.size>300000){alert('Voice note too large. Record a shorter clip.');return}let r=new FileReader();r.onload=()=>send('audio',r.result);r.readAsDataURL(blob)};rec.start();$('mic').textContent='⏹'}catch{alert('Microphone permission unavailable.')}};
if(token)start();
</script></body></html>
