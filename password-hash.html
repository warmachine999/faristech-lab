<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friends Chat Password Helper · FarisTech X</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--text:#edf2ff;--muted:#aab6d3;--accent:#78a9ff;--line:#2a3857}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2b4a,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(100%,560px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 60px #0006}
h1{font-size:1.45rem;margin:0 0 8px}p{color:var(--muted)}label{display:block;font-weight:650;margin:20px 0 8px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0b1325;color:var(--text);font:inherit}
button{margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#071226;font-weight:750;font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.result{margin-top:22px;display:none}.result input{font-size:.9rem}.note{font-size:.9rem;border-left:3px solid var(--accent);padding-left:12px}.status{min-height:1.5em;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Friends Chat Password Helper</h1>
<p>This page calculates the hash needed by the FarisTech chat server.</p>
<p class="note"><strong>Privacy:</strong> Your password is processed inside this browser. This page does not send it to a server, save it, or put it in the page address. Do not share the generated hash publicly.</p>
<form id="form">
<label for="target">Which Cloudflare secret are you updating?</label>
<select id="target" style="width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0b1325;color:var(--text);font:inherit">
<option value="CHAT_PASSWORD_HASH">Friends Chat password</option>
<option value="ADMIN_PASSWORD_HASH">Admin / moderation password</option>
</select>
<label for="password">Enter the password you want to use</label>
<input id="password" type="password" autocomplete="off" required>
<button id="generate" type="submit">Generate password hash</button>
</form>
<div class="status" id="status" role="status"></div>
<section class="result" id="result">
<label for="hash">Copy this into Cloudflare's selected secret</label>
<input id="hash" readonly>
<button id="copy" type="button">Copy hash</button>
</section>
</main>
<script>
const form=document.getElementById('form'),target=document.getElementById('target'),password=document.getElementById('password'),button=document.getElementById('generate'),status=document.getElementById('status'),result=document.getElementById('result'),hashField=document.getElementById('hash');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.textContent='Generating locally…';result.style.display='none';
 try{
  const salt=Uint8Array.from(atob('W+UFKwPL+YDiwNp8TpDtAA=='),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);
  hashField.value=btoa(String.fromCharCode(...new Uint8Array(bits)));
  result.style.display='block';status.textContent='Hash generated. Your password field has been cleared.';password.value='';
 }catch(error){status.textContent='Could not generate the hash in this browser. Try a current version of Chrome or Edge.';}
 finally{button.disabled=false;}
});
document.getElementById('copy').addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText(hashField.value);status.textContent='Hash copied. Paste it into ' + target.value + ' in Cloudflare.';}
 catch(error){hashField.select();status.textContent='Select and copy the hash manually.';}
});
</script>
</body>
</html>
