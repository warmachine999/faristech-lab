name: Validate FarisTech Lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate homepage scripts and VARON controls
        run: node scripts/check-site.cjs
      - name: Validate premium integration, routes, themes and Jewel Thief
        run: node scripts/check-fusion.cjs
      - name: Check real circuit rendering in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8173 --bind 127.0.0.1 >/tmp/faristech-circuit-http.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8173/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=1600 --dump-dom http://127.0.0.1:8173/ >/tmp/faristech-circuit-dom.html 2>/tmp/faristech-circuit-chrome.log
          grep -Eq 'id="iOut">2[0-9]\.[0-9]{2}<' /tmp/faristech-circuit-dom.html
          grep -Eq 'id="brightnessOut">[1-9][0-9]*<' /tmp/faristech-circuit-dom.html
          grep -q 'id="circuitStatus" class="status"><h3' /tmp/faristech-circuit-dom.html
          grep -q 'data-element="Inventium" data-symbol="Iv" data-atomic-number="127"' /tmp/faristech-circuit-dom.html
          grep -q 'class="inventium-number">127</span>' /tmp/faristech-circuit-dom.html
          grep -q 'class="inventium-symbol">Iv</span>' /tmp/faristech-circuit-dom.html
          grep -q 'id="circuitSchematicBtn"' /tmp/faristech-circuit-dom.html
          grep -q 'id="circuitRealisticBtn"' /tmp/faristech-circuit-dom.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=1600 --dump-dom 'http://127.0.0.1:8173/?circuitView=realistic' >/tmp/faristech-physical-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'data-view="realistic"' /tmp/faristech-physical-dom.html
          grep -q 'data-last-draw="realistic"' /tmp/faristech-physical-dom.html
          grep -Eq 'id="iOut">2[0-9]\.[0-9]{2}<' /tmp/faristech-physical-dom.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=1200 --dump-dom 'http://127.0.0.1:8173/?circuitView=realistic&explosionDemo=1' >/tmp/faristech-explosion-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'data-view="realistic"' /tmp/faristech-explosion-dom.html
          grep -q 'data-explosion="preview"' /tmp/faristech-explosion-dom.html
          grep -q 'data-explosion-events="1"' /tmp/faristech-explosion-dom.html
          grep -q 'id="circuitExplosionDemo"' /tmp/faristech-explosion-dom.html
          echo "Real-life animated explosion preview verified in Chromium."
          echo "Both schematic and real-life circuit modes render in a real browser."
          grep -q 'id="ftLedToggle"' /tmp/faristech-circuit-dom.html
          grep -q 'data-theme-choice="matcha"' /tmp/faristech-circuit-dom.html
          grep -q 'class="ft-ribbon-track"' /tmp/faristech-circuit-dom.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=2100 --dump-dom 'http://127.0.0.1:8173/jewel-thief.html' >/tmp/faristech-jewel-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'id="levelNum">01' /tmp/faristech-jewel-dom.html
          grep -q 'class="cell wall"' /tmp/faristech-jewel-dom.html
          grep -q 'class="piece thief"' /tmp/faristech-jewel-dom.html
          echo "Premium homepage and live Jewel Thief game rendered successfully in Chromium."
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=2300 --dump-dom 'http://127.0.0.1:8173/projects.html' >/tmp/faristech-project-library-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'id="search"' /tmp/faristech-project-library-dom.html
          grep -q 'projectCard' /tmp/faristech-project-library-dom.html
          grep -q 'project.html?id=0' /tmp/faristech-project-library-dom.html
          grep -q '8 project areas found' /tmp/faristech-project-library-dom.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=2300 --dump-dom 'http://127.0.0.1:8173/project.html?id=0' >/tmp/faristech-project-detail-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'id="name">3D Models' /tmp/faristech-project-detail-dom.html
          grep -q 'id="overview">' /tmp/faristech-project-detail-dom.html
          grep -q 'class="moreCard"' /tmp/faristech-project-detail-dom.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=2300 --dump-dom 'http://127.0.0.1:8173/projects.html?lang=ar' >/tmp/faristech-project-arabic-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'lang="ar" dir="rtl"' /tmp/faristech-project-arabic-dom.html
          grep -q 'نماذج ثلاثية الأبعاد' /tmp/faristech-project-arabic-dom.html
          echo "Project library and detail pages verified in Chromium (English and Arabic)."


