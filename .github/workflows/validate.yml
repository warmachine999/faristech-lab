name: Validate FarisTech Lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate homepage scripts and VARON controls
        run: node scripts/check-site.cjs
      - name: Validate Studio game logic and interaction regressions
        run: node scripts/check-studio-games.cjs
      - name: Check real circuit rendering in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8173 --bind 127.0.0.1 >/tmp/faristech-circuit-http.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8173/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=1600 --dump-dom http://127.0.0.1:8173/ >/tmp/faristech-circuit-dom.html 2>/tmp/faristech-circuit-chrome.log
          grep -Eq 'id="iOut">2[0-9]\.[0-9]{2}<' /tmp/faristech-circuit-dom.html
          grep -Eq 'id="brightnessOut">[1-9][0-9]*<' /tmp/faristech-circuit-dom.html
          grep -q 'id="circuitStatus" class="status"><h3' /tmp/faristech-circuit-dom.html
          grep -q 'id="circuitSchematicBtn"' /tmp/faristech-circuit-dom.html
          grep -q 'id="circuitRealisticBtn"' /tmp/faristech-circuit-dom.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=1600 --dump-dom 'http://127.0.0.1:8173/?circuitView=realistic' >/tmp/faristech-physical-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'data-view="realistic"' /tmp/faristech-physical-dom.html
          grep -q 'data-last-draw="realistic"' /tmp/faristech-physical-dom.html
          grep -Eq 'id="iOut">2[0-9]\.[0-9]{2}<' /tmp/faristech-physical-dom.html
          echo "Both schematic and real-life circuit modes render in a real browser."
          # Browser smoke test: exercise both the preview button and a genuine capacitor failure.
          python3 - <<'PY'
          from pathlib import Path
          original = Path('index.html').read_text(encoding='utf-8')
          preview = "<script>document.getElementById('realExplosionPreviewBtn').click();</script>"
          fault = "<script>const cap=document.getElementById('capPolarity');cap.value='reversed';cap.dispatchEvent(new Event('input',{bubbles:true}));</script>"
          Path('_lab-preview-explosion.html').write_text(original.replace('</body>',preview+'</body>',1),encoding='utf-8')
          Path('_lab-fault-explosion.html').write_text(original.replace('</body>',fault+'</body>',1),encoding='utf-8')
          PY
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=1100 --dump-dom 'http://127.0.0.1:8173/_lab-preview-explosion.html?circuitView=realistic' >/tmp/faristech-preview-explosion-dom.html 2>>/tmp/faristech-circuit-chrome.log
          if ! grep -q 'data-preview-explosion="capacitor"' /tmp/faristech-preview-explosion-dom.html; then
            echo "Preview explosion marker missing. Browser diagnostic:"
            python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/faristech-preview-explosion-dom.html').read_text(errors='replace')
          for marker in ['id="realExplosionPreviewBtn"', 'id="circuitCanvas"', 'data-view=', 'data-preview-explosion=', 'data-last-draw=', "realExplosionPreviewBtn').click()"]:
              pos=h.find(marker)
              print('MARKER',repr(marker),'POSITION',pos,'SNIPPET',repr(h[max(0,pos-170):pos+280]) if pos>=0 else '')
          print('CHROME LOG TAIL',Path('/tmp/faristech-circuit-chrome.log').read_text(errors='replace')[-2500:])
          PY
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=2600 --dump-dom 'http://127.0.0.1:8173/_lab-fault-explosion.html?circuitView=realistic' >/tmp/faristech-fault-explosion-dom.html 2>>/tmp/faristech-circuit-chrome.log
          grep -q 'data-real-explosion="capacitor"' /tmp/faristech-fault-explosion-dom.html
          grep -q 'id="circuitViewHint"' /tmp/faristech-fault-explosion-dom.html
          echo "Preview and authentic capacitor-failure explosions triggered in the real browser."


