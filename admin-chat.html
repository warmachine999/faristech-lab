<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Moderation · FarisTech X</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f5f7;font:15px system-ui}main{max-width:1000px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px}button,input{font:inherit}button{cursor:pointer;background:#398765;color:white;border:0;border-radius:9px;padding:9px 13px}input{background:#202329;color:white;border:1px solid #3a3f48;border-radius:9px;padding:12px;width:100%;margin:8px 0}.card{background:#1b1e24;border:1px solid #343942;border-radius:14px;padding:16px;margin:16px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.item{border-bottom:1px solid #363b44;padding:12px 0;overflow-wrap:anywhere}.muted{color:#aab1bc;font-size:13px}.danger{background:#8f3e48}.ghost{background:#30353e}#app[hidden],#login[hidden]{display:none}
</style></head><body><main><header><div><h1>Chat moderation</h1><div class="muted">FarisTech X · private admin tools</div></div><a href="index.html" style="color:#9bd8bb">Home</a></header>
<section class="card" id="login"><h2>Admin access</h2><input id="pass" type="password" placeholder="Admin password"><button id="loginBtn">Unlock moderation</button><p class="muted">This is separate from the public reference homepage.</p></section>
<section id="app" hidden><div class="tabs"><button id="activeTab">Active messages</button><button id="deletedTab" class="ghost">Deleted history</button><button id="reload" class="ghost">Refresh</button></div><div class="card"><div id="list"></div></div></section></main>
<script>
const API='https://faristech-chat-api.makerlab.workers.dev';let token='',mode='active';const $=x=>document.getElementById(x);
async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
$('loginBtn').onclick=async()=>{try{const d=await fetch(API+'/auth/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pass').value})});const x=await d.json();if(!d.ok)throw Error(x.error);token=x.token;$('login').hidden=true;$('app').hidden=false;load()}catch(e){alert(e.message)}};
$('activeTab').onclick=()=>{mode='active';load()};$('deletedTab').onclick=()=>{mode='deleted';load()};$('reload').onclick=load;
async function load(){try{const d=await api(mode==='active'?'/admin/messages':'/admin/deleted');$('list').innerHTML='';if(!d.messages.length){$('list').textContent='Nothing to show.';return}d.messages.forEach(m=>{const el=document.createElement('div');el.className='item';const title=document.createElement('strong');title.textContent=m.sender_name+' · '+(m.channel==='project'?'Project Chat':'Friends Chat')+' · '+new Date(mode==='active'?m.created_at:m.deleted_at).toLocaleString();const body=document.createElement('p');body.textContent=m.type==='text'?m.content:'['+m.type+' attachment]';const meta=document.createElement('div');meta.className='muted';meta.textContent='Sender ID: '+m.sender_id+(m.edited_at?' · edited':'');el.append(title,body,meta);const btn=document.createElement('button');if(mode==='active'){btn.textContent='Delete';btn.className='danger';btn.onclick=async()=>{if(confirm('Delete this message?')){await api('/messages/'+m.id,'DELETE');load()}}}else{btn.textContent='Restore';btn.className='ghost';btn.onclick=async()=>{await api('/admin/restore','POST',{deletedId:m.id});load()}}el.append(btn);$('list').append(el)})}catch(e){alert(e.message)}}
</script></body></html>
