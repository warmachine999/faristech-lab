<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friends Chat — FarisTech X</title>
<style>
:root{color-scheme:dark;--bg:#06070c;--panel:#10121b;--panel2:#151827;--text:#f8f8ff;--muted:#a6a9b8;--line:rgba(255,255,255,.11);--purple:#9357ff;--cyan:#2be7ff;--shadow:0 20px 70px rgba(0,0,0,.25)}
html[data-theme=light]{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--panel2:#eef1f8;--text:#11131a;--muted:#656b79;--line:rgba(10,20,30,.12);--shadow:0 20px 70px rgba(20,30,60,.09)}
html[data-theme=tech]{color-scheme:dark;--bg:#03080d;--panel:#07111a;--panel2:#0a1721;--text:#eefaff;--muted:#8299aa;--line:rgba(59,203,225,.18);--purple:#795cff;--cyan:#00d7f4;--shadow:0 22px 70px rgba(0,0,0,.42)}
html[data-theme=caramel]{color-scheme:dark;--bg:#24160d;--panel:#392312;--panel2:#452a15;--text:#fff8ed;--muted:#d2bda5;--line:rgba(255,225,190,.13);--purple:#ff8a26;--cyan:#7bddff;--shadow:0 20px 70px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(color-mix(in srgb,var(--text) 3%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--text) 3%,transparent) 1px,transparent 1px);background-size:58px 58px}
button,input{font:inherit}.page{width:min(100%,1050px);min-height:100dvh;margin:auto;padding:clamp(12px,3vw,28px);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(1.3rem,4vw,2rem);margin:0}.sub{color:var(--muted);font-size:.85rem}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--panel2);color:var(--text);font-weight:750;cursor:pointer;text-decoration:none}
.primary{background:var(--purple);color:white;border-color:transparent}
.panel{margin:18px auto 0;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:60vh}
.setup{padding:14px;display:flex;gap:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
input{min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--panel2);color:var(--text)}
#friendPassword{flex:1}#friendName{flex:1}
#friendChatBody{display:flex;flex-direction:column;flex:1;min-height:0}
.tools{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.messages{flex:1;min-height:38vh;max-height:65vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:min(82%,680px);padding:10px 13px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:color-mix(in srgb,var(--purple) 18%,var(--panel2))}
.bubble small{display:block;color:var(--muted);font-size:.7rem;margin-bottom:4px}
.compose{display:none;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
.compose.ready{display:grid}.compose input[type=text]{width:100%}
.notice{padding:9px 14px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line)}
.chatImage{max-width:100%;height:auto;border-radius:10px;display:block;margin-top:6px}.chatAudio{width:100%;margin-top:6px}
@media(max-width:600px){.page{padding:10px}.panel{margin-top:12px;border-radius:13px}.messages{min-height:42vh;padding:11px}.compose{grid-template-columns:minmax(0,1fr) auto;}.compose .mediaBtn{grid-row:2}.compose #friendSend{grid-row:2}.bubble{max-width:92%}header{align-items:flex-start}}
</style></head>
<body><div class="page">
<header><div><h1>Friends Chat</h1><div class="sub">FarisTech X · invited friends</div></div><div class="actions"><button class="btn" id="themeBtn">Theme</button><a class="btn" href="index.html">← Home</a></div></header>
<section class="panel">
<div id="friendLock" class="setup"><input id="friendPassword" type="password" placeholder="Chat password" autocomplete="current-password"><button class="btn primary" id="friendUnlock">Unlock chat</button></div>
<div id="friendChatBody" hidden>
<div class="setup"><input id="friendName" maxlength="24" placeholder="Your display name"><button class="btn" id="friendJoin">Set name</button><span class="sub" id="readOnlyNote">Leave blank to read only.</span></div>
<div class="tools"><button class="btn" id="friendClearLocal">Reset this device</button></div>
<div id="friendChatMessages" class="messages" aria-live="polite"></div>
<div class="notice">Messages and media are saved only in this browser on this device. They are not synchronized with other people or devices yet.</div>
<div class="compose" id="friendCompose"><input id="friendMessage" type="text" maxlength="500" placeholder="Write a message…"><label class="btn mediaBtn">Image<input id="friendImage" type="file" accept="image/*" hidden></label><button class="btn mediaBtn" id="friendVoice" type="button">🎙 Voice</button><button class="btn primary" id="friendSend" type="button">Send</button></div>
</div></section></div>
<script>
const $=id=>document.getElementById(id), PASSWORD='123456788', KEY='faristech_private_chat_v3';
let unlocked=false,recorder=null,chunks=[];
function applyTheme(){const t=localStorage.getItem('ft-theme')||'dark';document.documentElement.dataset.theme=['dark','light','tech','caramel'].includes(t)?t:'dark'}
function cycleTheme(){const ts=['dark','light','tech','caramel'],cur=document.documentElement.dataset.theme;const next=ts[(ts.indexOf(cur)+1)%ts.length];localStorage.setItem('ft-theme',next);applyTheme()}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function name(){return $('friendName').value.trim()}
function syncComposer(){ $('friendCompose').classList.toggle('ready',!!name()); $('readOnlyNote').textContent=name()?'You can now send messages.':'Leave blank to read only.'}
function render(){const box=$('friendChatMessages');box.innerHTML='';const arr=load();if(!arr.length){const d=document.createElement('div');d.className='bubble';d.textContent='Welcome. The chat is ready on this device.';box.append(d);return}arr.forEach(m=>{const b=document.createElement('div');b.className='bubble '+(m.name===name()?'me':'');const s=document.createElement('small');s.textContent=(m.name||'Friend')+' · '+new Date(m.time).toLocaleString();b.append(s);if(m.type==='image'){const im=document.createElement('img');im.src=m.data;im.className='chatImage';b.append(im)}else if(m.type==='audio'){const au=document.createElement('audio');au.controls=true;au.src=m.data;au.className='chatAudio';b.append(au)}else{const span=document.createElement('span');span.textContent=m.text||'';b.append(span)}box.append(b)});box.scrollTop=box.scrollHeight}
function add(m){const n=name();if(!n){syncComposer();return}const a=load();a.push({...m,name:n,time:Date.now()});save(a);render()}
$('themeBtn').onclick=cycleTheme;applyTheme();
$('friendUnlock').onclick=()=>{if($('friendPassword').value.trim()!==PASSWORD){alert('Incorrect password.');return}unlocked=true;$('friendLock').hidden=true;$('friendChatBody').hidden=false;$('friendName').value=localStorage.getItem('ft-friend-name')||'';syncComposer();render()};
$('friendPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('friendUnlock').click()});
$('friendJoin').onclick=()=>{const n=$('friendName').value.trim();if(n)localStorage.setItem('ft-friend-name',n);else localStorage.removeItem('ft-friend-name');syncComposer();render()};
$('friendName').addEventListener('input',syncComposer);
$('friendSend').onclick=()=>{const msg=$('friendMessage').value.trim();if(!msg||!name())return;localStorage.setItem('ft-friend-name',name());add({type:'text',text:msg});$('friendMessage').value=''};
$('friendMessage').addEventListener('keydown',e=>{if(e.key==='Enter')$('friendSend').click()});
$('friendClearLocal').onclick=()=>{if(confirm('Clear chat messages saved on this device?')){localStorage.removeItem(KEY);render()}};
$('friendImage').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>3*1024*1024){alert('Choose an image smaller than 3 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>add({type:'image',data:r.result});r.readAsDataURL(f);e.target.value=''};
$('friendVoice').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();$('friendVoice').textContent='🎙 Voice';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const r=new FileReader();r.onload=()=>add({type:'audio',data:r.result});r.readAsDataURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}))};recorder.start();$('friendVoice').textContent='⏹ Stop'}catch{alert('Microphone permission was not available.')}};
</script></body></html>
